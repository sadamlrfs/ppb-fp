org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Disable Kotlin incremental compilation — fixes cross-drive build failure on Windows
# (project on D: but Pub cache on C: causes "different roots" error in Kotlin compiler)
kotlin.incremental=false
