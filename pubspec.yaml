name: mindease
description: MindEase — Mental Wellness Companion App
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  google_fonts: ^6.2.1
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_messaging: ^15.1.0
  firebase_crashlytics: ^4.1.0

  # Google Sign In
  google_sign_in: ^6.2.0

  # State Management
  provider: ^6.1.2

  # HTTP
  http: ^1.2.2

  # Cloudinary
  cloudinary_public: ^0.23.1
  image_picker: ^1.1.2

  # Audio
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0

  # Charts
  fl_chart: ^0.68.0

  # Utils
  intl: ^0.19.0
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.3.0

  # AI
  google_generative_ai: ^0.4.6

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#388E3C"
    theme_color: "#4CAF50"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
